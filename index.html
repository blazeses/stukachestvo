<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Посещаемость</title>
<style>
:root{--bg:#f3f7f7;--card:#fff;--tx:#0d1f22;--mut:#5d7478;--ac:#0aa8a0;--acx:#fff;--no:#d6455d;--ln:#d5e3e3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050b0c;--card:#0e1a1c;--tx:#d9f7f4;--mut:#7fa4a2;--ac:#2be3d6;--acx:#032321;--no:#ff6b81;--ln:#1b3033}}
:root[data-theme="dark"]{--bg:#050b0c;--card:#0e1a1c;--tx:#d9f7f4;--mut:#7fa4a2;--ac:#2be3d6;--acx:#032321;--no:#ff6b81;--ln:#1b3033}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 120px}
h1{font-size:22px;margin:4px 0 12px}
.row{display:flex;gap:8px;margin-bottom:10px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
textarea{min-height:260px;resize:vertical}
button{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px;cursor:pointer}
button.main{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
button:focus-visible,input:focus-visible,textarea:focus-visible,.st:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sum{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
.big{font-size:20px;font-weight:700}
.mut{color:var(--mut);font-size:14px}
.st{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:14px;margin-bottom:6px;border-radius:12px;background:var(--card);border:1px solid var(--ln);min-height:52px;user-select:none}
.st b{font-size:24px;width:32px;text-align:center;color:var(--no)}
.st.on{border-color:var(--ac)}
.st.on b{color:var(--ac)}
.st.on span{opacity:.75}
.bot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bot div{max-width:560px;margin:0 auto;display:flex;gap:8px}
.bot .main{flex:1}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 10px;color:var(--mut);font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--ac)}
.hide{display:none}
</style>
</head>
<body>
<main>
<section id="setup" class="hide">
<h1>Список группы</h1>
<p class="mut">Вставь ФИО, каждое с новой строки. Список сохранится на этом устройстве.</p>
<textarea id="names" placeholder="Иванов Иван&#10;Петрова Анна&#10;Сидоров Пётр"></textarea>
<div class="row" style="margin-top:10px"><button class="main" id="saveList" style="flex:1">Сохранить список</button></div>
</section>

<section id="work" class="hide">
<h1>Посещаемость</h1>
<div class="row"><input id="date" type="date" aria-label="Дата"><input id="pair" placeholder="Пара / предмет" aria-label="Пара или предмет"></div>
<div class="sum">
<div class="big" id="cnt">0 из 0</div>
<div class="mut" id="abs">Отсутствуют: все</div>
<div class="bar"><i id="fill"></i></div>
</div>
<label class="chk"><input type="checkbox" id="onlyAbs"> В сообщение — только отсутствующие</label>
<div id="list"></div>
<div class="row" style="margin-top:12px"><button id="all">Все пришли</button><button id="none">Сбросить отметки</button><button id="edit">Список</button></div>
<div class="bot"><div><button class="main" id="copy">Скопировать для куратора</button></div></div>
</section>
</main>
<script>
(function(){
var K="attendance-v1",st={names:[],on:{},date:"",pair:"",onlyAbs:false};
function load(){try{var s=localStorage.getItem(K);if(s){var o=JSON.parse(s);if(o&&o.names)st=Object.assign(st,o)}}catch(e){}}
function save(){try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(d){var p=d.split("-");return p.length==3?p[2]+"."+p[1]+"."+p[0]:d}
function render(){
 var has=st.names.length>0;
 $("setup").classList.toggle("hide",has&&!editing);
 $("work").classList.toggle("hide",!has||editing);
 if(!has||editing){return}
 $("date").value=st.date;$("pair").value=st.pair;$("onlyAbs").checked=st.onlyAbs;
 var l=$("list");l.innerHTML="";
 st.names.forEach(function(n,i){
  var b=document.createElement("button");b.type="button";b.className="st"+(st.on[i]?" on":"");
  b.setAttribute("aria-pressed",st.on[i]?"true":"false");
  b.innerHTML="<span></span><b></b>";b.firstChild.textContent=n;b.lastChild.textContent=st.on[i]?"+":"−";
  b.onclick=function(){st.on[i]=!st.on[i];save();render()};
  l.appendChild(b)});
 var p=st.names.filter(function(_,i){return st.on[i]}).length,t=st.names.length;
 $("cnt").textContent="Присутствуют: "+p+" из "+t;
 var a=st.names.filter(function(_,i){return !st.on[i]});
 $("abs").textContent=a.length?"Отсутствуют: "+a.join(", "):"Отсутствующих нет";
 $("fill").style.width=(t?p/t*100:0)+"%";
}
function text(){
 var head=fmt(st.date)+(st.pair?", "+st.pair:""),p=0,out=[];
 st.names.forEach(function(n,i){if(st.on[i])p++});
 var a=st.names.filter(function(_,i){return !st.on[i]});
 if(st.onlyAbs){out.push(head);out.push(a.length?"Отсутствуют:":"Все присутствуют.");a.forEach(function(n){out.push(n+" -")})}
 else{out.push(head);st.names.forEach(function(n,i){out.push(n+" "+(st.on[i]?"+":"-"))})}
 out.push("");out.push("Присутствуют: "+p+" из "+st.names.length);
 return out.join("\n");
}
function toast(m){var b=$("copy"),o=b.textContent;b.textContent=m;setTimeout(function(){b.textContent=o},1600)}
function copy(){
 var t=text();
 function fb(){var x=document.createElement("textarea");x.value=t;x.style.position="fixed";x.style.opacity="0";document.body.appendChild(x);x.focus();x.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(x);toast(ok?"Скопировано ✓":"Не вышло, выдели текст вручную")}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("Скопировано ✓")},fb)}else fb();
}
var editing=false;
load();if(!st.date)st.date=today();if(!st.names.length){st.names=["Андрущук Маргарита Максимовна", "Бойченко Любовь Александровна", "Геворкян Роман Рубенович", "Гончарова Софья Сергеевна", "Горбатенко Дарья Ивановна", "Дворовкин Данил Андреевич", "Дернов Артемий Константинович", "Диваков Евгений Константинович", "Зянтерекова Валерия Константиновна", "Ладатко Константин Григорьевич", "Лихманова Арина Андреевна", "Лукьянов Кирилл Дмитриевич", "Марченко Глеб Максимович", "Овсейко Тимофей", "Овчинникова Ксения Олеговна", "Пилягин Алексей Сергеевич", "Подосенов Артём Александрович", "Рябов Евгений Романович", "Савич Никита Евгеньевич", "Филиппов Давид Сергеевич", "Цыбульский Иван Денисович", "Чепурина Арина Вячеславовна", "Чернаткин Глеб Витальевич", "Чехуров Александр Юрьевич", "Штынь Виктория Евгеньевна"];st.on={};save()}
$("saveList").onclick=function(){
 var n=$("names").value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
 if(!n.length)return;
 var old={};st.names.forEach(function(x,i){if(st.on[i])old[x]=1});
 st.names=n;st.on={};n.forEach(function(x,i){if(old[x])st.on[i]=true});
 editing=false;save();render()};
$("edit").onclick=function(){editing=true;$("names").value=st.names.join("\n");render()};
$("all").onclick=function(){st.names.forEach(function(_,i){st.on[i]=true});save();render()};
$("none").onclick=function(){st.on={};save();render()};
$("copy").onclick=copy;
$("date").onchange=function(){st.date=this.value||today();save()};
$("pair").oninput=function(){st.pair=this.value;save()};
$("onlyAbs").onchange=function(){st.onlyAbs=this.checked;save()};
render();
})();
</script>
</body>
</html>
